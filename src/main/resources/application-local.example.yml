spring:
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/ticketing?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
        username: root
        password: change-me
    jpa:
        properties:
            hibernate:
                format_sql: true

# Generate with: openssl rand -base64 32
security:
    jwt:
        secret-key: REPLACE_WITH_A_BASE64_ENCODED_32_BYTE_SECRET

app:
    cookie:
        secure: false
    cors:
        allowed-origins:
            - http://localhost:5173

logging:
    level:
        org.hibernate.SQL: DEBUG
        org.hibernate.orm.jdbc.bind: TRACE
