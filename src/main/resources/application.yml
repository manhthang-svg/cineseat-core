spring:
    application:
        name: ticketing-backend
    flyway:
        baseline-on-migrate: false
        enabled: true
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: false
                jdbc:
                    batch_size: 25
                order_inserts: true
                order_updates: true
        show-sql: false
    profiles:
        default: local

security:
    refresh-token:
        cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}
    jwt:
        secret-key: ${JWT_SECRET_KEY}
        expiration: ${JWT_ACCESS_EXPIRATION_MS:900000}
        refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
        issuer: ${JWT_ISSUER:ticketing-system}
        audience: ${JWT_AUDIENCE:ticketing-api}
        clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}

app:
    cookie:
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:Strict}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
    shutdown: graceful
    error:
        include-message: never
        include-stacktrace: never
    compression:
        enabled: true

springdoc:
    api-docs:
        enabled: true
        path: /v3/api-docs
    swagger-ui:
        enabled: true
        path: /swagger-ui.html
        disable-swagger-default-url: true
        display-request-duration: true
        operations-sorter: method
        tags-sorter: alpha

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    endpoint:
        health:
            probes:
                enabled: true
            show-details: never
    metrics:
        tags:
            application: ${spring.application.name}

logging:
    pattern:
        level: "%5p [requestId=%X{requestId:-}]"
